# ClientoraHQ share Worker (Loom-style links for the free screen recorder). Deploy (owner only): see README.md.
name = "chq-share"
main = "index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false
routes = [
  { pattern = "share.clientorahq.com", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "https://tools.clientorahq.com,http://localhost:4820,http://localhost:4821"
PUBLIC_URL = "https://share.clientorahq.com"

[[r2_buckets]]
binding = "SHARES"
bucket_name = "chq-shares"

# Per-IP limit on upload requests (each 50 MB part is one request). Needs Wrangler 4.36+.
[[ratelimits]]
name = "LIMITER"
namespace_id = "2001"
simple = { limit = 40, period = 60 }
